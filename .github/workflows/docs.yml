name: docs

on:
  push:
    # `master` is where the published site comes from. `feat/docs-site` is here so the
    # site can be previewed from a fork before it is merged - GitHub only offers manual
    # dispatch for workflows that already exist on the default branch, which this one
    # does not until that merge happens. Drop the second entry once it does.
    branches: [master, feat/docs-site]
    paths:
      - 'docs/**'
      - 'landing/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'landing/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Serve the site straight from a Pages artifact (no gh-pages branch).
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "mkdocs-material~=9.7"
      # Layer 1: the hand-written landing page, at the site root.
      - run: |
          mkdir -p _site
          cp -r landing/. _site/
      # Layer 2: the docs, beneath it at /docs/.
      # --strict turns a broken internal link into a failed build, which is the only
      # thing that reliably stops doc rot in a repo this size.
      - run: mkdocs build --strict -d _site/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Deploy only from master; a PR gets the build check above and nothing else.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
