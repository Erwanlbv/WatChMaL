# Graph attention network whose edges are built in its own forward pass.
#
# Pair with data/dataset/hk_h5_graph_classification.yaml, which supplies data.pos and no
# edge_index. Changing knn_k changes the graph without touching the data.
_target_: watchmal.model.gat.GraphAttentionNetwork

hidden_channels: 128
num_heads: 4
num_layers: 4

# Node feature columns supplied by the dataset: charge, time and the three coordinates.
in_channels: 5
out_channels: 2

num_cls_tokens: 1
mlp_expansion_factor: 4
activation: relu
node_encoder_input_norm: False

# Neighbours per hit. The search runs on the device the batch occupies, through
# torch_cluster where it is installed and a chunked torch.cdist fallback otherwise.
knn_k: 8
knn_loop: False
knn_undirected: True

# 0, not 3: the coordinates already reach the encoder as feature columns, where the
# Normalize transform scales them. Appending data.pos here instead would feed the encoder
# raw centimetres alongside features scaled to [0, 1] — measured on one event, the signal
# then carries 0.00 % of the input variance (charge 1.0e-02 and time 1.3e-02 against
# 3.0e+06, 3.2e+06 and 4.6e+06 for x, y and z) and the model cannot learn.
position_dim: 0

use_nhits: True
use_event_total_charge: True
